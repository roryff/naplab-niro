path_follower_node:
  ros__parameters:
    # path_csv_file and desired_speed_mps are supplied at launch time
    auto_enable: false
    # Map frame origin — must match gnss_node.yaml origin_lat/lon.
    # All published coordinates are shifted by -UTM32(origin) to keep values
    # near zero for WebGL float32 precision in Foxglove 3D.
    origin_lat: 63.4391
    origin_lon: 10.4128
    horizon: 64   # max enforced by code; 3.2s / ~8.6m lookahead at 2.7 m/s
    # Cost weights
    # NOTE: the steering actuator is rate-limited (~1 s to full torque, tau_r up to
    # ~3 s at low corner speed) → it is a low-pass; high-freq actuation is impossible.
    # Closed-loop bandwidth (set by these weights) must stay BELOW the actuator
    # bandwidth or the result is a slow limit cycle. The Opus* bags showed weight_cte
    # 250 + psi 10 + terminal×4 + a fast integral pushed past that → ~3 m swings on
    # the hard path. Reverted to near-original damped gains; bias is now handled by
    # the gentle disturbance estimator below, so high CTE gain is unnecessary.
    weight_cte:    1000.0   # Path3: model verified accurate (L_real~=L_eff), but corners held a
                           # standing +0.18 m parallel offset — psi damping tolerated it. Raise
                           # cte/psi ratio 4->6 to actively migrate back to the line (headroom exists).
    weight_psi:    5.0    # restored — heading damping; the main stabiliser
    weight_torque: 0.005   # reverted — actuator can't chatter, so no anti-chatter penalty needed
    # NOTE: weight_delta, terminal_weight_factor, path_spline_knot_m, rate_rising,
    # rate_sinking, torque_limit and weight_complementarity are now compile-time
    # constants in path_follower_node.cpp (set-once; recompile to change).

    # ── Actuator model: speed-scheduled first-order (SchedFO2) ─────────────────
    # Breakpoints from the steering actuator system identification.
    sched_v_kmh: [5.0, 10.0, 15.0, 20.0, 25.0, 30.0, 36.0, 40.0, 45.0, 50.0]
    sched_tau_r:  [2.953, 1.386, 0.722, 0.627, 0.437, 0.390, 0.342, 0.295, 0.247, 0.200]
    sched_kss:    [501.9, 314.9, 187.4, 143.2, 105.5, 84.6, 71.2, 63.3, 53.9, 44.1]

    # ── Curvature-aware speed profile ─────────────────────────────────────────
    # Builds a per-waypoint v_ref by inverting
    # the K_ss table: finds the max speed where the steering model can achieve
    # the required angle for each path curvature.  Backward/forward smoothing
    # passes then enforce braking and acceleration limits.
    # Envelope was 0.5/0.5 — too gentle: braked early and recovered slowly, so the
    # car sat below 4 m/s ~40% of the hard path (the "slows more than it needs to").
    # accel raised most (faster recovery after corners — does NOT raise corner-entry
    # speed, so corner tracking is unchanged); decel raised modestly.
    speed_profile_decel_mps2:  0.4   # max deceleration for backward pass [m/s²]
    speed_profile_accel_mps2:  0.4   # max acceleration for forward pass  [m/s²]
    # ── Jerk-limited profile (Pass 6) ─────────────────────────────────────────
    # The accel/decel passes above are jerk-UNBOUNDED: at every plateau edge (corner
    # entry/exit, cruise top before a turn) the planned acceleration steps between
    # ±limit and 0, so the FF (a_ff = v_ref·dv/ds) reproduces that step → a jerk
    # spike at the v_ref peaks. Pass 6 spreads each step into a ramp bounded by this
    # jerk budget (rounds the v_ref corners; profile stays ≤ the feasible envelope).
    # The smoothing window ≈ v·(accel+decel)/jerk, so LOWER jerk = wider window =
    # smoother but it also eats narrow peaks (J=1.0 crushed the s≈330 peak 4.9→3.6).
    # J=2.0 (window ~3.2 m) keeps peaks (s≈330: 4.3) and caps FF-scale jerk uniformly
    # at ~0.43 m/s³ (trapezoidal was 1.57), corner tops and entry bottoms alike.
    # Raise toward the accel/decel-implied peak jerk to preserve peaks further; 0 = off.
    speed_profile_jerk_mps3:   2.0   # [m/s³] longitudinal jerk budget for the profile
    curvature_speed_margin:    0.65 # was 0.75 — more headroom for torque-saturated corner peaks (P4)
    # ── Curvature-RATE (S-curve) speed limit ──────────────────────────────────
    # HardPath10 showed the worst CTE (|CTE| 0.176 vs 0.093 elsewhere, 16% rate-
    # limited) at turn->opposite-turn reversals: the actuator needs 0.5-0.7s to
    # swing torque polarity, but at the inflection |kappa|~=0 so curvature_speed_
    # margin above sees a "straight" and SPEEDS UP — least time for the hardest
    # move. This caps the demanded steering slew dδ/dt = v*L*|dκ/ds| at the budget
    # below, so v dips automatically at inflections (where |dκ/ds| is large) and is
    # untouched on real straights (|dκ/ds|~0). Budget = road-wheel deg/s the PROFILE
    # reserves for path-following slew; actuator does ~15.5 deg/s total, so leave
    # headroom for feedback. Lower = slows more at S-curves. 0 = disabled.
    # NOTE: bounded below by v_ref_min_mps, so raise that floor's headroom if you
    # want deeper S-curve slowdowns.
    # Lowered 12 -> 6: at 12 the slew cap landed ~13 m/s and never bound on the
    # gentle S at progress ~200 m (|dκ/ds| ~0.006 over the 3 m window); 6 re-arms
    # it so the S lobes are actually slowed.
    curvature_rate_slew_budget_deg_s: 6.0
    v_ref_min_mps:             3.0    # speed floor in profile [m/s]
    # ── Constant-speed curve holding (Pass 1b) ────────────────────────────────
    # A waypoint counts as "in a curve" if |kappa| exceeds this OR its speed was
    # already limited below cruise. Contiguous in-curve waypoints form a zone that
    # is frozen to its slowest point and not accelerated through (see s_turn /
    # curve bridge below). 0.015 rad/m ~= R 67 m catches light turns too.
    curve_hold_kappa_radpm:    0.015
    # Two curve zones are MERGED into one (held at the slower of the two) when the
    # near-straight gap between them is shorter than this. s_turn applies across a
    # curvature SIGN REVERSAL (the inflection of an S, ~23 m on this path); curve
    # applies between same-sign bends (noise / short straight). This is what stops
    # the profile recovering speed at an S-turn inflection.
    s_turn_bridge_m:           30.0
    curve_bridge_m:            6.0
    # Forward lookahead applied to the speed profile (Pass 4 in buildSpeedProfile).
    # For each waypoint, scans ahead by max(v_ref * lookahead_s, 20 m) and sets
    # v_ref[i] to the minimum over that window. The 20 m floor ensures the scan
    # always reaches the start of the braking ramp so the FF term dv/ds stays ≤ 0
    # through corner entries — preventing mid-corner acceleration.
    # A second backward pass (Pass 5) re-enforces the decel constraint.
    # 0 = disabled. 1.5 s is a good starting point.
    speed_lookahead_s:         0.0

    # ── Longitudinal acceleration feedforward ─────────────────────────────────
    # A pure-P speed controller lags the moving v_ref setpoint: LongPath8mpsFinal
    # showed v_ego trailing v_ref by ~0.85 s (RMS 0.42 m/s) — the classic steady
    # error of P-following-a-ramp. The feedforward supplies the acceleration the
    # profile already plans at each point, a_ff = v_ref·dv_ref/ds, inverted through
    # the longitudinal plant gain, so feedback only trims the residual. Offline
    # closed-loop sim on this bag: lag 1.25 s → 0.05 s, RMS 0.49 → 0.15 m/s.
    speed_feedforward_gain:  1.0    # scales the FF term (0 = disable, pure P)
    # Longitudinal plant gain. The receiver (joystickd) maps our accel_cmd to
    # physical accel by accel = clip(4.0*cmd, -3.5, +2.0): a SYMMETRIC 4.0 m/s²
    # per unit cmd in the linear region; the 2.0/3.5 are downstream safety SATURATION
    # caps, NOT gains. The old 2.0/3.5 here mistook the caps for the plant gain, so
    # the FF (a_ff/gain) over-commanded drive by 4.0/2.0=2x → v_ego ran ~0.3 m/s
    # above v_ref on every rising ramp (pure-P loop, no integrator, can't null it).
    # Set both to the true 4.0 → FF inversion is exact both ways. We stay well inside
    # the caps (accel_max 0.7 << 2.0), so the saturation asymmetry never bites.
    lon_accel_per_cmd:       4.0    # drive gain [m/s² per +cmd]  (was 2.0)
    lon_decel_per_cmd:       4.0    # brake gain [m/s² per -cmd]  (was 3.5)
    accel_max_mps2:          0.7    # max drive accel [m/s²] → maps to +cmd via /lon_accel_per_cmd
    decel_max_mps2:          0.7    # max brake decel [m/s²] → maps to -cmd via /lon_decel_per_cmd
    # Backstop slew on accel_cmd. ×4 (receiver gain) → physical jerk cap = rate*4.
    # 1.0 → 4 m/s³, above the FF's legitimate onset demand (~0.34 cmd/s) so it only
    # clips disturbance/reversal spikes. Was 200.0 (= no-op, never bound).
    accel_cmd_rate_per_s:    1.0    # [cmd/s]; ×4 = 4 m/s³ jerk backstop

    # ── Offset-free disturbance estimator (P1) ────────────────────────────────
    # A leaky integral of the CTE error: d_cte += ki·cte·dt. This is the whole
    # controller-side disturbance handling — it converges to the constant lateral drift
    # (camber/trim/path bias, ~-0.12 m/s on this car) and nulls the steady offset both
    # ways. Ungated; frozen while torque-saturated. Keep it slow relative to the rate-
    # limited actuator; raise gain to clear the offset faster, back off if it oscillates.
    # d_cte is warm-started to cte_drift_init on enable (the car's known converged value)
    # so it doesn't re-learn from 0 — kills the ~60 s first-lap transient. The IMU
    # sideslip/yaw-discrepancy are measured ~0 in this regime and are NOT fed to the
    # controller — only published as diagnostics.
    cte_integral_gain:   0.0 #was 0.15   # [1/s] leaky-integral gain on CTE
    cte_integral_limit:  0.30   # [m/s] clamp on estimated drift (anti-windup)
    cte_drift_init:      0.0    # [m/s] warm-start value for d_cte on enable (converged drift)
    # Freeze INTEGRATION (not application) above this |kappa| so corner-transient CTE from
    # hard tracking doesn't corrupt the accumulated drift — integrate on straights, apply
    # everywhere. 0.02 rad/m ≈ R 50 m; raise to integrate in gentler curves, 0 = always integrate.
    integrator_curvature_gate: 0.02  # [rad/m]

    # ── Understeer-corrected feedforward (P2) ─────────────────────────────────
    # Effective wheelbase L_eff(v) = L + Kus*v^2 replaces the pure-Ackermann L in
    # the yaw dynamics, so the MPC commands enough steer at speed and stops riding
    # wide in corners. Tuning: increase if corners still ride wide (rear axle
    # outside); decrease if it cuts inside.
    understeer_gradient:     0.02  # Kus [s^2/m]. 0.003->0.010 was a clean win (nice7 vs nice5:
                                     # RMS 0.148->0.079, peak 0.81->0.24, corner|CTE| 0.122->0.078,
                                     # corner sat 19%->12%). Still rides slightly wide (delta_error
                                     # -1.43deg, no over-steer) -> headroom to push to 0.013. STOP if
                                     # delta_error crosses toward 0 / CTE flips inside (over-steer).
                                     # NOTE: after STEERING_RATIO fix to 13.27 (was 15.33), the ratio
                                     # error was causing -0.376 deg mean delta_error (OpusNicePath5).
                                     # Fix R alone → +0.025 deg mean (near zero). With Kus=0.010 the
                                     # corrected corner mean becomes +0.139 deg (slight over-steer).
                                     # RETUNE: reduce toward 0.003-0.005 after running a test bag.
