# Config for FoxgloveRelayNode instances.
# Each node transcodes one H.265 camera stream to H.264 preview, lazily,
# only while a Foxglove subscriber is connected.

/**:
  ros__parameters:
    encode_bitrate_bps: 500000   # 500 kbps — low quality preview only
    restart_cooldown_ms: 3000    # wait 3s after error before retrying pipeline

/relay_front:
  ros__parameters:
    input_topic: 'cameras/front/image_compressed'
    output_topic: 'cameras/front/image_compressed_preview'

/relay_right:
  ros__parameters:
    input_topic: 'cameras/right/image_compressed'
    output_topic: 'cameras/right/image_compressed_preview'

/relay_rear:
  ros__parameters:
    input_topic: 'cameras/rear/image_compressed'
    output_topic: 'cameras/rear/image_compressed_preview'

/relay_left:
  ros__parameters:
    input_topic: 'cameras/left/image_compressed'
    output_topic: 'cameras/left/image_compressed_preview'
