lateral_mpc_node:
  ros__parameters:
    # path_csv_file and desired_speed_mps are supplied at launch time
    auto_enable: false
    # Map frame origin — must match gnss_node.yaml origin_lat/lon.
    # All published coordinates are shifted by -UTM32(origin) to keep values
    # near zero for WebGL float32 precision in Foxglove 3D.
    origin_lat: 63.4391
    origin_lon: 10.4128
    horizon: 64   # max enforced by code; 3.2s / ~8.6m lookahead at 2.7 m/s
    # Cost weights
    # NOTE: the steering actuator is rate-limited (~1 s to full torque, tau_r up to
    # ~3 s at low corner speed) → it is a low-pass; high-freq actuation is impossible.
    # Closed-loop bandwidth (set by these weights) must stay BELOW the actuator
    # bandwidth or the result is a slow limit cycle. The Opus* bags showed weight_cte
    # 250 + psi 10 + terminal×4 + a fast integral pushed past that → ~3 m swings on
    # the hard path. Reverted to near-original damped gains; bias is now handled by
    # the gentle disturbance estimator below, so high CTE gain is unnecessary.
    weight_cte:    180.0   # Path3: model verified accurate (L_real~=L_eff), but corners held a
                           # standing +0.18 m parallel offset — psi damping tolerated it. Raise
                           # cte/psi ratio 4->6 to actively migrate back to the line (headroom exists).
    weight_psi:    30.0    # restored — heading damping; the main stabiliser
    weight_torque: 0.005   # reverted — actuator can't chatter, so no anti-chatter penalty needed
    weight_delta:  0.0   # bag3 showed this increased saturation without improving tracking
    terminal_weight_factor: 1.0   # off — overweighting the 3.2 s-ahead step raised gain → overshoot
    reference_point: "rear_axle"
    path_spline_knot_m: 5.0   # B-spline knot spacing for path smoothing [m]; 0 = disabled
    rate_rising:  1.033   # |u| increasing (0→±1) [norm/s]
    rate_sinking: 1.833   # |u| decreasing (±1→0) [norm/s]
    torque_limit: 1.0
    weight_complementarity: 2.0  # L1 penalty discouraging u_plus and u_minus both nonzero

    # ── Actuator model ────────────────────────────────────────────────────────
    # use_sched_fo2: true  →  speed-scheduled SchedFO2 model (breakpoints below)
    # use_sched_fo2: false →  fixed integrator with tau_r / gain_r
    use_sched_fo2: true
    tau_r:  0.78    # first-order time constant [s]   (fixed model only)
    gain_r: 36.0    # steady-state sw-deg/s per unit torque  (fixed model only)

    # Speed-scheduled first-order model — same identification as steering_mpc_node.yaml.
    # Switch use_sched_fo2 to true to activate.
    sched_v_kmh: [5.0, 10.0, 15.0, 20.0, 25.0, 30.0, 36.0, 40.0, 45.0, 50.0]
    sched_tau_r:  [2.953, 1.386, 0.722, 0.627, 0.437, 0.390, 0.342, 0.295, 0.247, 0.200]
    sched_kss:    [501.9, 314.9, 187.4, 143.2, 105.5, 84.6, 71.2, 63.3, 53.9, 44.1]

    # ── Curvature-aware speed profile ─────────────────────────────────────────
    # Requires use_sched_fo2: true.  Builds a per-waypoint v_ref by inverting
    # the K_ss table: finds the max speed where the steering model can achieve
    # the required angle for each path curvature.  Backward/forward smoothing
    # passes then enforce braking and acceleration limits.
    # Envelope was 0.5/0.5 — too gentle: braked early and recovered slowly, so the
    # car sat below 4 m/s ~40% of the hard path (the "slows more than it needs to").
    # accel raised most (faster recovery after corners — does NOT raise corner-entry
    # speed, so corner tracking is unchanged); decel raised modestly.
    speed_profile_decel_mps2:  0.5   # max deceleration for backward pass [m/s²]
    speed_profile_accel_mps2:  0.5   # max acceleration for forward pass  [m/s²]
    curvature_speed_margin:    0.75  # was 0.75 — more headroom for torque-saturated corner peaks (P4)
    # ── Curvature-RATE (S-curve) speed limit ──────────────────────────────────
    # HardPath10 showed the worst CTE (|CTE| 0.176 vs 0.093 elsewhere, 16% rate-
    # limited) at turn->opposite-turn reversals: the actuator needs 0.5-0.7s to
    # swing torque polarity, but at the inflection |kappa|~=0 so curvature_speed_
    # margin above sees a "straight" and SPEEDS UP — least time for the hardest
    # move. This caps the demanded steering slew dδ/dt = v*L*|dκ/ds| at the budget
    # below, so v dips automatically at inflections (where |dκ/ds| is large) and is
    # untouched on real straights (|dκ/ds|~0). Budget = road-wheel deg/s the PROFILE
    # reserves for path-following slew; actuator does ~15.5 deg/s total, so leave
    # headroom for feedback. Lower = slows more at S-curves. 0 = disabled.
    # NOTE: bounded below by v_ref_min_mps, so raise that floor's headroom if you
    # want deeper S-curve slowdowns.
    curvature_rate_slew_budget_deg_s: 6.0
    v_ref_min_mps:             3.0    # speed floor in profile [m/s]

    # ── Runtime speed adjustments ─────────────────────────────────────────────
    # speed_lookahead_s: preview window for speed reference. The controller reads
    #   the minimum vref over [s_ref, s_ref + v*t], shifting the braking signal
    #   earlier so the P-controller has time to decelerate before corners.
    speed_lookahead_s:       1.5    # lookahead time [s]; scales to ~9 m at 6 m/s

    # CTE penalty: v_desired *= max(0, 1 - k * max(0, |cte| - deadband))
    # Reduces speed when off-path so lateral controller can recover without
    # losing corner feasibility. Set k=0 to disable.
    cte_speed_k:             0.0    # penalty gain [1/m]; 0 = disabled
    cte_deadband_m:          0.3    # CTE deadband [m] — no penalty below this

    # Heading error penalty: same structure as CTE penalty.
    heading_speed_k:         0.0    # penalty gain [1/deg]; 0 = disabled
    heading_deadband_deg:    5.0    # heading error deadband [deg]

    # ── Offset-free MPC: lateral-disturbance estimator (P1) ───────────────────
    # Leaky integral of CTE estimates a constant lateral drift [m/s] (camber,
    # steering zero-trim, model bias) and feeds it into the CTE prediction so the
    # controller rejects it instead of leaving a steady ~0.2 m offset. Reset to 0
    # on every enable / path load. cte_integral_limit bounds it (anti-windup).
    # Tuning: raise gain until the straight offset clears in a few seconds without
    # slow oscillation; back off if it oscillates. MUST be slow relative to the
    # actuator (which is itself slow) — a fast/large integral stacks phase lag on the
    # rate-limited steering and drives a slow limit cycle. Estimation is also frozen
    # while torque is saturated (anti-windup, in the node). The 0.6 gain / 0.5 m/s
    # limit in the Opus* bags wound up badly in the saturated corners.
    cte_integral_gain:       0.15   # [1/s]  integral gain on CTE (gentle, ~6 s timescale)
    cte_integral_limit:      0.15   # [m/s]  clamp on estimated drift (realistic camber/bias)
    # Curvature gate (P1b): w_hat is a STRAIGHT-line drift estimate. On the Path4 bag the
    # debug topic proved the global w_hat (-0.06 m/s) injected a phantom -0.20 m drift that
    # opposed the +0.17 m corner offset 85% of the time -> MPC predicted self-cancel (3x
    # optimism) and under-committed. Gate fades w_hat estimation AND application to 0 as
    # |kappa| -> this value, so it helps straights without corrupting corners.
    # 0.02 rad/m = R 50 m. Raise to gate only sharper corners; lower to gate more gently.
    disturbance_curvature_gate: 0.02   # [rad/m]; set 0 to disable gating (old behaviour)

    # ── Understeer-corrected feedforward (P2) ─────────────────────────────────
    # Effective wheelbase L_eff(v) = L + Kus*v^2 replaces the pure-Ackermann L in
    # the yaw dynamics, so the MPC commands enough steer at speed and stops riding
    # wide in corners. Tuning: increase if corners still ride wide (rear axle
    # outside); decrease if it cuts inside.
    understeer_gradient:     0.010  # Kus [s^2/m]. 0.003->0.010 was a clean win (nice7 vs nice5:
                                     # RMS 0.148->0.079, peak 0.81->0.24, corner|CTE| 0.122->0.078,
                                     # corner sat 19%->12%). Still rides slightly wide (delta_error
                                     # -1.43deg, no over-steer) -> headroom to push to 0.013. STOP if
                                     # delta_error crosses toward 0 / CTE flips inside (over-steer).
                                     # Corner-local (kappa>0), so straight stability unaffected.
