lateral_mpc_node:
  ros__parameters:
    # path_csv_file and desired_speed_mps are supplied at launch time
    auto_enable: false
    horizon: 40
    # Cost weights
    weight_cte:    20.0
    weight_psi:    3.0
    weight_torque: 0.01
    weight_delta:  0.0   # bag3 showed this increased saturation without improving tracking
    reference_point: "rear_axle"
    path_spline_knot_m: 5.0   # B-spline knot spacing for path smoothing [m]; 0 = disabled
    # Asymmetric rate limits for u+/u- split (magnitude-based, not signed)
    rate_up:      1.033  # rise: torque magnitude increase [norm/s]
    rate_down:    1.833  # fall: torque magnitude decrease [norm/s]
    torque_limit: 1.0
    split_l1:     0.05   # L1 penalty on u_p+u_m to enforce complementarity

    # ── Actuator model ────────────────────────────────────────────────────────
    # use_sched_fo2: true  →  speed-scheduled SchedFO2 model (breakpoints below)
    # use_sched_fo2: false →  fixed integrator with tau_r / gain_r
    use_sched_fo2: true
    tau_r:  0.78    # first-order time constant [s]   (fixed model only)
    gain_r: 36.0    # steady-state sw-deg/s per unit torque  (fixed model only)

    # Speed-scheduled first-order model — same identification as steering_mpc_node.yaml.
    # Switch use_sched_fo2 to true to activate.
    sched_v_kmh: [5.0, 10.0, 15.0, 20.0, 25.0, 30.0, 36.0, 40.0, 45.0, 50.0]
    sched_tau_r:  [2.953, 1.386, 0.722, 0.627, 0.437, 0.390, 0.342, 0.295, 0.247, 0.200]
    sched_kss:    [501.9, 314.9, 187.4, 143.2, 105.5, 84.6, 71.2, 63.3, 53.9, 44.1]
