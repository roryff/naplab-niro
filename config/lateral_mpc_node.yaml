lateral_mpc_node:
  ros__parameters:
    # path_csv_file and desired_speed_mps are supplied at launch time
    auto_enable: false
    horizon: 40
    tau_r:   0.78
    gain_r:  36.0
    # Cost weights
    weight_cte:    20.0
    weight_psi:    3.0
    weight_torque: 0.01
    weight_delta:  0.0   # delta reference tracking weight; 0.0 = disabled
    # Sched_fo2 actuator model path (empty = use fixed tau_r/gain_r above)
    sched_fo2_model_path: ""
