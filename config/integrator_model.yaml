# Integrator forward model — A8 quadratic-speed (fitted from Kia Niro EV data)
# Speed-dependent gain: gain_r(v) = G0 / (va*v^2 + vb*v + 1)  [sw-deg/s per unit torque]
# At v=5 m/s:  gain ≈ 182 sw-deg/s  |  At v=15 m/s: gain ≈ 75  |  At v=25 m/s: gain ≈ 44
# val_rmse=10.2°, peak_ratio=0.956 (best physics model — speed-adaptive, suitable for QP/MPC)
G0: 300
va: 0.01
vb: 0.08
tau_r: 0.01
# leak=0: the controller actively holds angle via torque; self-centring is not modelled
# as phantom decay (the open-loop fitted leak=1.5 caused the MPC to fight its own model).
leak: 0.0
u0: 0.02
rate_clip: 500.0
max_angle_deg: 450.0
delay_s: 0.0

# Controller
dt: 0.1
horizon: 30
rate_up: 1.0333333333333334
rate_down: 1.8333333333333333
torque_limit: 1.0
weight_angle: 1.0
weight_torque: 0.01
