camera_node:
  ros__parameters:
    # UDP multicast camera streams: front, right, rear, left
    # All on port 10030, multicast IPs differ
    
    cameras:
      front:
        uri: "udp://239.10.0.1:10030"
        frame_id: "camera_front"
        topic: "cameras/front/compressed"
        fps: 60
        description: "Front-facing camera"
      
      right:
        uri: "udp://239.10.0.2:10030"
        frame_id: "camera_right"
        topic: "cameras/right/compressed"
        fps: 60
        description: "Right-side camera"
      
      rear:
        uri: "udp://239.10.0.3:10030"
        frame_id: "camera_rear"
        topic: "cameras/rear/compressed"
        fps: 60
        description: "Rear-facing camera"
      
      left:
        uri: "udp://239.10.0.4:10030"
        frame_id: "camera_left"
        topic: "cameras/left/compressed"
        fps: 60
        description: "Left-side camera"
    
    # GStreamer pipeline settings
    gstreamer:
      # HEVC decoding: udpsrc → rtph265depay → h265parse → avdec_hevc → videoconvert → appsink
      # Drop late frames for low latency
      drop_on_lateness: true
      
      # UDP multicast socket buffer (bytes)
      udp_buffer_size: 4194304  # 4 MB for bursty HEVC data
      
      # Ring buffer duration (ms) for sync tolerance
      ring_buffer_ms: 100
