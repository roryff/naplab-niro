# Parameters for both Ouster OS1 lidar drivers.
# Shared settings (/**:) apply to all nodes; per-lidar sections override below.

/**:
  ros__parameters:
    udp_dest: ''
    lidar_mode: ''
    # Stamp clouds/IMU with host ROS time so they share the GNSS /tf clock.
    # Empty/sensor modes use the Ouster internal oscillator (seconds since power-on),
    # which doesn't match utm32->base_link and pins clouds at the path origin in viz.
    timestamp_mode: 'TIME_FROM_ROS_TIME'
    point_type: 'xyzir'

/lidar_side/os_driver:
  ros__parameters:
    sensor_hostname: '192.168.2.181'
    sensor_frame: 'lidar_side/os_sensor'
    lidar_frame:  'lidar_side/os_lidar'
    imu_frame:    'lidar_side/os_imu'

/lidar_top/os_driver:
  ros__parameters:
    sensor_hostname: '192.168.2.204'
    sensor_frame: 'lidar_top/os_sensor'
    lidar_frame:  'lidar_top/os_lidar'
    imu_frame:    'lidar_top/os_imu'
