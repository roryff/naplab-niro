# Speed-scheduled first-order steering model (SchedFO2)
# Identified from step-response tests on Kia Niro EV, NAPLab NTNU, 2025.
#
# Model structure (ZOH discrete, Ts=dt):
#   theta[k+1] = exp(-Ts/tau_r(v)) * theta[k]  +  K_ss(v) * (1 - exp(-Ts/tau_r(v))) * u[k]
#
# tau_r(v): first-order time constant [s] (monotone decreasing with speed)
# K_ss(v):  DC gain [steering-wheel-deg / unit-torque]
#
# NRMSE fit: 84-92% across 5-50 km/h (10 step-response tests).

use_sched_fo2: 1

# Breakpoint speeds [km/h]
sched_v_kmh: 5.0 10.0 15.0 20.0 25.0 30.0 36.0 40.0 45.0 50.0

# Time constants tau_r(v) [s]
sched_tau_r: 2.953 1.386 0.722 0.627 0.437 0.390 0.342 0.295 0.247 0.200

# DC gains K_ss(v) [sw-deg / unit torque]
sched_kss: 501.9 314.9 187.4 143.2 105.5 84.6 71.2 63.3 53.9 44.1

# MPC controller parameters
dt:            0.05   # timestep [s] — 20 Hz
horizon:       40     # prediction steps (2 s lookahead)
rate_up:       1.0333333333  # max torque ramp-up rate [1/s]
rate_down:     1.8333333333  # max torque ramp-down rate [1/s]
torque_limit:  1.0
weight_angle:  1.0
weight_torque: 0.01
